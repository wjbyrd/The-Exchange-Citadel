/* =========================================
   5. PROGRESS & MAZE TRACK — SAFE TO CUSTOMIZE (WITH RULES)
========================================= */
    
/* Progress bar container — background track */
#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(3,10,24,0.95),
        rgba(2,6,23,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(56,189,248,0.22);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.82),
        0 0 10px rgba(56,189,248,0.12);
}
    
/* Progress fill — width controlled by JS */
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #0b3b5a,
        #38bdf8,
        #0ea5e9);
    box-shadow:
        0 0 12px rgba(56,189,248,0.45),
        0 0 22px rgba(14,165,233,0.25);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}
    
/* Individual room cell — default state */
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.72),
        rgba(2,6,23,0.86));
    border: 1px solid rgba(56,189,248,0.18);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.72),
        0 0 5px rgba(56,189,248,0.08);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */
.maze-box.active {
    background: radial-gradient(circle,
        rgba(56,189,248,0.48),
        rgba(37,99,235,0.36),
        rgba(3,10,24,0.92));
    border: 2px solid #f8d981;
    box-shadow:
        0 0 12px rgba(248,217,129,0.78),
        0 0 24px rgba(56,189,248,0.48),
        inset 0 0 12px rgba(0,0,0,0.62);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(37,99,235,0.62),
        rgba(3,10,24,0.88));
    border-color: rgba(56,189,248,0.38);
    box-shadow:
        0 0 8px rgba(56,189,248,0.28),
        inset 0 0 10px rgba(0,0,0,0.7);
}

/* Boss room highlights (10, 20, 30) — visual only */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(37,99,235,0.8);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #60a5fa,
        0 0 18px rgba(14,165,233,0.75);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f8d981,
        0 0 24px rgba(14,165,233,0.95),
        0 0 34px rgba(56,189,248,0.42);
}

/* Streak styling — Exchange Citadel */
.streak {
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:0.5px;
    color: rgba(243,234,210,0.94);
    text-shadow:
        0 0 7px rgba(56,189,248,0.32),
        0 2px 5px rgba(0,0,0,0.85);
}

.streak-icon {
    width:22px;
    height:22px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 8px rgba(56,189,248,0.75))
        drop-shadow(0 0 15px rgba(14,116,144,0.52));
    background: radial-gradient(circle,
        rgba(248,217,129,0.46) 0%,
        rgba(37,99,235,0.34) 45%,
        transparent 72%);
    animation: pulseControl 2.2s ease-in-out infinite;
}

    text-align: center;
}

	
#artifactVault h3 {
    color: #f8d981;
    text-shadow:
        0 0 10px rgba(56,189,248,0.52),

}

	
/* Layout container for artifact slots */
.vaultRow {
    display: flex;
    justify-content: center;
    align-items:flex-end;
    gap: 15px;
    flex-wrap:wrap;
}

/* Individual artifact slot (default = locked state) */    
.artifactSlot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    text-align:center;
    opacity: .26;
    transition: all .4s ease;
}

/* Locked artifact image (dimmed effect) */    
.artifactSlot img {
    width: 45px;
    margin-bottom:4px;
    filter:
        brightness(0.28)
        contrast(0.85)
        sepia(0.35);
    transition: all .4s ease;
}

/* Artifact label text */
.artifactSlot span {
    display: block;
    font-size: 13px;
    color: rgba(216,199,160,0.38);
    margin-top: 8px;
    line-height: 1.2;
}

/* Glow + animation for unlocked artifacts */
.artifactSlot.unlocked {
    opacity: 1;
    transform: scale(1.05);
}

.artifactSlot.unlocked img {
    filter:
        drop-shadow(0 0 14px rgba(248,217,129,0.86))
        drop-shadow(0 0 26px rgba(56,189,248,0.46))
        drop-shadow(0 0 34px rgba(14,165,233,0.24));
    animation: relicPulse 2.5s ease-in-out infinite;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.artifactSlot.unlocked span {
    color: #eef8ff;
    font-weight: 600;
    text-shadow:
        0 0 7px rgba(56,189,248,0.38),
        0 2px 5px rgba(0,0,0,0.85);
}

	
/* =========================================
   7. BOSS EFFECTS & ATMOSPHERE — SAFE TO CUSTOMIZE
========================================= */
    
/* Hit animation — triggered when boss takes damage */
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

/* Boss image display — includes floating animation */
.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

	
/* Boss 1 -specific glow effects */

        drop-shadow(0 0 12px rgba(56,189,248,0.82))

/* Boss 2 -specific glow effects */

		drop-shadow(0 0 14px rgba(245,230,184,0.88))

}


	
/* Boss 3 -specific glow effects */

/* Ambient torch effect — decorative, shown during gameplay */

/* =========================================
   9. ANIMATION SYSTEM — SAFE TO CUSTOMIZE (WITH CARE)
========================================= */

/* Ambient lighting effect (environmental immersion) */    
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.05) saturate(1.04);
  }
  50% {
    filter: brightness(0.96) saturate(0.98);
  }
  75% {
    filter: brightness(1.04) saturate(1.03);
  }
}

/* Damage feedback (quick impact effect) */    
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss-specific hit feedback (stronger shake) */    
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room highlight animation (maze tracker) */   
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(56,189,248,0.68),
      inset 0 0 10px rgba(0,0,0,0.6);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(248,217,129,0.92),
      0 0 32px rgba(56,189,248,0.48),
      0 0 42px rgba(37,99,235,0.24),
      inset 0 0 12px rgba(0,0,0,0.64);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(56,189,248,0.78),
      0 0 24px rgba(14,165,233,0.24),
      inset 0 0 11px rgba(0,0,0,0.64);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(248,217,129,0.72),
      0 0 30px rgba(56,189,248,0.36),
      inset 0 0 12px rgba(0,0,0,0.68);
  }
}


	

/* Victory text animation (end screen emphasis) */    
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(248,217,129,0.72),
      0 2px 6px rgba(0,0,0,0.9);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(248,217,129,0.95),
      0 0 42px rgba(56,189,248,0.62),
      0 0 52px rgba(14,165,233,0.36),
      0 3px 8px rgba(0,0,0,0.9);
  }
}


/* Idle boss movement (subtle hovering effect) */    
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */   
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Wizard idle animation (subtle movement) */    
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance animation */    
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* General pulse animation for relics */   
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(56,189,248,0.66))
      drop-shadow(0 0 18px rgba(37,99,235,0.34))
      drop-shadow(0 0 24px rgba(0,0,0,0.55));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(248,217,129,0.92))
      drop-shadow(0 0 30px rgba(56,189,248,0.55))
      drop-shadow(0 0 38px rgba(14,165,233,0.24));
  }
}

/* Streak Icon Glow */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

  [bgMusic, bossMusic, finalBossMusic, sfxMilestone, sfxVictory, sfxBossHit, sfxCorrect, sfxWrong]
    .filter(Boolean)
    .forEach(audio => {
      audio.muted = isMuted;

}

  soundEnabled = !soundEnabled;
  localStorage.setItem("gauntletSoundEnabled", soundEnabled ? "true" : "false");

}

function restoreSoundSetting(){
  const saved = localStorage.getItem("gauntletSoundEnabled");

  setAllGameAudioMuted(!soundEnabled);
  updateSoundToggle();
}

function goFullscreen(){
let el = document.documentElement;

// Check if we are ALREADY in fullscreen
let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

if (!isFullscreen) {
        // ENTER Fullscreen
        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
            el.msRequestFullscreen();
        }
    } else {
        // EXIT Fullscreen (Crucial for iOS to reset the state)
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }

function generatePseudonymFromEmail(email) {
    const titles = [
        "Axiom", "Grid", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];

    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Reserve Custodian",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];

    let hash = 0;
    const cleanEmail = email.trim().toLowerCase();

    for (let i = 0; i < cleanEmail.length; i++) {
        hash = ((hash << 5) - hash) + cleanEmail.charCodeAt(i);
        hash |= 0;
    }

    const positiveHash = Math.abs(hash);

    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);

    return `${title}${role}${number}`;
}

function inferSkill(question){
    if(!question) return null;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "").toLowerCase();
    const objective = (question.objective || "").toLowerCase();

    if(tag.includes("identity") || tag.includes("accounting") || objective.includes("6.1") || q.includes("s = i + nco") || q.includes("nx = nco") || q.includes("y = c + i + g + nx")) return "open_economy_identities";
    if(tag.includes("saving") || tag.includes("investment") || tag.includes("capital") || tag.includes("nco") || objective.includes("6.2") || q.includes("net capital outflow") || q.includes("capital flow")) return "saving_investment_capital_flows";
    if(tag.includes("small_open") || tag.includes("world_interest") || tag.includes("r_star") || objective.includes("6.3") || q.includes("small open economy") || q.includes("world interest rate")) return "small_open_world_interest_rate";
    if(tag.includes("trade") || tag.includes("net_exports") || tag === "nx" || objective.includes("6.4") || q.includes("trade surplus") || q.includes("trade deficit") || q.includes("net exports")) return "trade_balance_net_exports";
    if(tag.includes("exchange") || tag.includes("currency") || q.includes("real exchange rate") || q.includes("nominal exchange rate") || q.includes("appreciat") || q.includes("depreciat")) return "exchange_rate_adjustment";
    if(tag.includes("policy") || tag.includes("fiscal") || tag.includes("tariff") || tag.includes("quota") || objective.includes("6.5") || q.includes("budget deficit") || q.includes("trade policy") || q.includes("capital flight")) return "open_economy_policy_effects";
    if(tag.includes("mundell") || tag.includes("mf") || tag.includes("open_economy_model") || objective.includes("14.1") || q.includes("mundell") || q.includes("is*") || q.includes("lm*")) return "mundell_fleming_model";
    if(tag.includes("interest_differential") || tag.includes("risk_premium") || tag.includes("capital_mobility") || objective.includes("14.2") || q.includes("risk premium") || q.includes("interest rate differential")) return "interest_differential_capital_mobility";
    if(tag.includes("fixed") || tag.includes("floating") || tag.includes("exchange_regime") || objective.includes("14.3") || q.includes("fixed exchange rate") || q.includes("floating exchange rate")) return "fixed_floating_exchange_regimes";
    if(tag === "ad" || tag.includes("aggregate_demand") || tag.includes("price_level") || objective.includes("14.4") || q.includes("aggregate demand") || q.includes("price level")) return "small_open_aggregate_demand";

    return tag || null;
}
	 
function getObjectiveBucket(question){
    const objectiveKey = inferObjective(question);
    if(!masteryState.byObjective[objectiveKey]){
        masteryState.byObjective[objectiveKey] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return masteryState.byObjective[objectiveKey];
}

function getObjectiveAccuracy(question){
    return getAccuracy(getObjectiveBucket(question));
}

function getObjectiveFluency(question){
    return getFluency(getObjectiveBucket(question), question?.type || "default");
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

function getTagAccuracy(tag){
    return getAccuracy(getTagBucket(tag));
}

function getTagTypeAccuracy(tag, type){
    return getAccuracy(getTypeBucket(tag, type));
}

function getTagFluency(tag){
    return getFluency(getTagBucket(tag), "default");
}

function getTagTypeFluency(tag, type){
    return getFluency(getTypeBucket(tag, type), type || "default");
}

function recordAdaptiveAttempt(question, isCorrect, responseTime){
    if(!question || !question.tag) return;

    const tagBucket = getTagBucket(question.tag);
    const typeBucket = getTypeBucket(question.tag, question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const skillBucket = getSkillBucket(question);

    updateBucket(tagBucket, isCorrect, responseTime);
    updateBucket(typeBucket, isCorrect, responseTime);
    updateBucket(objectiveBucket, isCorrect, responseTime);
    updateBucket(skillBucket, isCorrect, responseTime);

    masteryState.recent.push({
        correct: !!isCorrect,
        responseTime,
        tag: question.tag,
        type: question.type || "default",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: getSkillKey(question)
    });

    if(masteryState.recent.length > 20){
        masteryState.recent.shift();
    }
}

function getRecentPerformance(windowSize = 8){
    const recent = masteryState.recent.slice(-windowSize);
    if(recent.length === 0){
        return { accuracy: 0, avgCorrectRatio: 1.2, count: 0 };
    }

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

function getWeakestTag(){
    const entries = Object.keys(masteryState.byTag);

    if(entries.length === 0){
        const fallback = Object.entries(conceptMemory || {}).sort((a,b) => b[1]-a[1])[0];
        return fallback ? fallback[0] : null;
    }

    let weakestTag = null;
    let weakestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){
            strongestScore = strength;
            strongestTag = tag;
        }
    });

    return strongestTag;
}

function getSelectionProfile(){
    const recent = getRecentPerformance(8);
    const strongestTag = getStrongestTag();
    const strongestFluency = strongestTag ? getTagFluency(strongestTag) : 0;

    return {
        recentAccuracy: recent.accuracy,
        avgCorrectRatio: recent.avgCorrectRatio,
        strongestTag,
        strongestFluency,
        mediumReady: streak >= 5 && recent.count >= 5 && recent.accuracy >= 0.8,
        hardReady: streak >= 8 && recent.count >= 6 && recent.accuracy >= 0.88 && recent.avgCorrectRatio <= 1.2 && strongestFluency >= 0.72,
        eliteReady: streak >= 14 && recent.count >= 8 && recent.accuracy >= 0.92 && recent.avgCorrectRatio <= 1.05 && strongestFluency >= 0.82
    };
}

function determineSelectionPurpose(profile){
    if(profile.recentAccuracy === 0 && getRecentPerformance(8).count === 0) return "support";
    if(profile.eliteReady) return "stretch";
    if(profile.recentAccuracy < 0.65) return "repair";
    if(profile.recentAccuracy < 0.8) return "confirm";
    if(profile.hardReady) return "challenge";
    return "diversify";
}

function shouldTriggerDetour(question){
    if(!question || !question.tag) return false;
    const tagWeakness = conceptMemory[question.tag] || 0;
    const typeBucket = getTypeBucket(question.tag, question.type);
    const typeAccuracy = getAccuracy(typeBucket);
    const objectiveAccuracy = getObjectiveAccuracy(question);

    return tagWeakness >= 2.2
        || (typeBucket && typeBucket.attempts >= 2 && typeAccuracy !== null && typeAccuracy < 0.6)
        || (objectiveAccuracy !== null && objectiveAccuracy < 0.5 && getObjectiveBucket(question).attempts >= 2);
}

    };

}

function planRemediation(question, responseTime){
    if(!question || !question.tag) return null;

    const expected = getTypeTargetMs(question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const objectiveAccuracy = getAccuracy(objectiveBucket);
    const objectiveAttempts = objectiveBucket?.attempts || 0;
    const carelessMiss = responseTime < expected * 0.55 && (objectiveAccuracy === null || objectiveAccuracy >= 0.45);
    const repeatedObjectiveMiss = objectiveAttempts >= 2 && objectiveAccuracy !== null && objectiveAccuracy < 0.6;
    const slowStruggle = responseTime > expected * 1.2;
    const skill = getSkillKey(question);

    return {
        active: true,
        stage: carelessMiss ? "bridge" : "repair",
        tag: question.tag,
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: skill,
        commonError: question.commonError || null,
        sourceType: question.type || "default",
        returnRoom: room,
        originQuestionId: question.id || null,
        careless: carelessMiss,
        repeatedObjectiveMiss,
        slowStruggle
    };
}

function getRemediationStageLabel(stage){

}

function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey || inferSkill(q) === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

    if(room <= 9) return "easy";

}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);
    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}

function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        if(state.skill && microSkillRepairPools[state.skill]){
            const skillRepairPool = microSkillRepairPools[state.skill] || [];
            const skillRepairCandidates = getQuestionsMatchingNeed(
                skillRepairPool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillRepairCandidates.length > 0){
                return weightedPick(skillRepairCandidates, {
                    mode: "support",
                    purpose: "repair"
                });
            }
        }

        const allRepairPool = Object.values(microSkillRepairPools).reduce((all, pool) => all.concat(pool), []);
        const repairCandidates = getQuestionsMatchingNeed(
            allRepairPool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(repairCandidates.length > 0){
            return weightedPick(repairCandidates, {
                mode: "support",
                purpose: "repair"
            });
        }
    }

    if(state.stage === "bridge"){
        if(state.skill && microSkillBridgePools[state.skill]){
            const skillBridgePool = microSkillBridgePools[state.skill] || [];
            const skillBridgeCandidates = getQuestionsMatchingNeed(
                skillBridgePool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillBridgeCandidates.length > 0){
                return weightedPick(skillBridgeCandidates, {
                    mode: "support",
                    purpose: "confirm"
                });
            }
        }

        const allBridgePool = Object.values(microSkillBridgePools).reduce((all, pool) => all.concat(pool), []);
        const bridgeCandidates = getQuestionsMatchingNeed(
            allBridgePool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(bridgeCandidates.length > 0){
            return weightedPick(bridgeCandidates, {
                mode: "support",
                purpose: "confirm"
            });
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}

function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {
            id: 999999,
            q: "No question pool is available for this room. Check the questionBanks configuration.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            a: 0,
            tag: "system",
            type: "default",
            objective: "system_check",
            feedback: "A question pool is missing."
        };
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

function startTimedModeClock(){
    timedModeEndTime = Date.now() + timedModeDurationMs;

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "flex";

    updateTimedModeClock();

    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
    }

    timedModeTimerInterval = setInterval(updateTimedModeClock, 250);
}

function stopTimedModeClock(){
    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
        timedModeTimerInterval = null;
    }

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "none";

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.classList.remove("timer-warning");
        timerDisplay.innerText = "10:00";
    }
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

function endTimedModeRun(){
    if(gameMode !== "timed") return;

    stopTimedModeClock();
    gameMode = "timed-complete";

    const accuracy = totalAttempts > 0
        ? Math.round((correctAnswers / totalAttempts) * 100)
        : 0;

    const bestRoom = Number(localStorage.getItem("exchangeCitadelTimedBestRoom") || 0);
    if(timedHighestRoom > bestRoom){
        localStorage.setItem("exchangeCitadelTimedBestRoom", String(timedHighestRoom));
    }

    localStorage.setItem("exchangeCitadelTimedLastRoom", String(room));
    localStorage.setItem("exchangeCitadelTimedLastHighestRoom", String(timedHighestRoom));
    localStorage.setItem("exchangeCitadelTimedLastAccuracy", String(accuracy));
    localStorage.setItem("exchangeCitadelTimedLastAttempts", String(totalAttempts));
    localStorage.setItem("exchangeCitadelTimedLastStreak", String(maxStreak));
    localStorage.setItem("exchangeCitadelTimedLastSetbacks", String(timedSetbacks));

	recordTimedTrialAchievementStats(accuracy, timedHighestRoom);

    sendGameData({
        runID: runID,
        game: "The Exchange Citadel",
        event: "timed_complete",
        user: username,
        email: studentEmail,
        room: room,
        questionId: 0,
        correct: 1,
        tag: "",
        type: "",
        objective: "",
        responseTime: 0,
        attempt: totalAttempts,
        streak: streak,
        elapsedTime: startTime ? (Date.now() - startTime) : 0,
        adaptiveMode: "timed_complete",
        totalTime: timedModeDurationMs,
        accuracy: accuracy / 100,
        maxStreak: maxStreak,
        totalAttempts: totalAttempts
    });

    document.getElementById("bossMessage").innerText = "";
    document.getElementById("formulaHint").innerText = "";
    document.getElementById("artifactDrop").style.display = "none";
    document.getElementById("questionImageBox").style.display = "none";

    document.getElementById("question").innerHTML = `
        <span class="boss-title">TIME EXPIRED</span>
        <div class="boss-q">
            You reached as far as Room ${timedHighestRoom}.<br><br>

            Total Attempts: ${totalAttempts}<br>
            Best Streak: ${maxStreak}<br>

    `;

    document.getElementById("answers").innerHTML = `
        <button class="continue-btn" onclick="restartTimedMode()">Retry Timed Trial</button>
        <button class="continue-btn" onclick="returnToModeSelectFromRun()">Choose Another Citadel Run</button>
    `;

    document.getElementById("message").innerText = "The trial ends. The Citadel records the result.";
}

{id:9100,q:"Legendary final chain: saving is fixed, investment demand rises, then the real exchange rate adjusts. Which Custodian ruling is correct?",options:["S - I falls, NCO falls, the real exchange rate appreciates, and NX falls","S - I rises, NCO rises, the real exchange rate depreciates, and NX rises","Investment demand changes NX only through tariffs","The world interest rate must fall because investment rose"],a:0,tag:"open_economy_synthesis",type:"legendary_boss_chain",objective:"LO6.5",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"investment_shift_trade_balance",repairSkill:"investment_shift_trade_balance",boss:"The Custodian",feedback:"Higher investment with fixed saving lowers S - I, reduces NCO, appreciates the currency, and lowers NX."},
{id:9101,q:"Legendary regime chain: a country wants a fixed exchange rate and free capital mobility, but also wants to fight a recession with independent monetary expansion. What does the trilemma say?",options:["It must give up one of the three; the peg and capital mobility block independent monetary policy","It can keep all three if fiscal policy is contractionary","It can keep all three if NX is positive","The trilemma applies only to closed economies"],a:0,tag:"impossible_trinity",type:"legendary_boss_policy",objective:"LO14.3",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",boss:"The Custodian",feedback:"Fixed exchange rates plus free capital mobility force the money supply to defend the peg, so monetary independence is lost."},
{id:9102,q:"Legendary Mundell-Fleming memo: under floating rates, monetary expansion raises income mainly because...",options:["currency depreciation raises net exports","government spending rises automatically","the world interest rate rises","the real exchange rate appreciates and imports fall"],a:0,tag:"floating_exchange_policy",type:"legendary_boss_policy",objective:"LO14.1",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"floating_monetary_policy",repairSkill:"floating_monetary_policy",boss:"The Custodian",feedback:"The floating-rate monetary channel works through depreciation, higher NX, and higher income."},
{id:9103,q:"Legendary AD derivation: the price level falls in a small open economy with floating exchange rates. Which sequence is complete?",options:["M/P rises → LM* shifts right → exchange rate falls → NX rises → Y rises","M/P falls → IS* shifts left → NX falls → Y falls","G rises → r* falls → investment rises → Y rises","NX falls → currency appreciates → AD shifts left"],a:0,tag:"mundell_fleming_ad",type:"legendary_boss_chain",objective:"LO14.4",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"derive_ad_from_mf",repairSkill:"derive_ad_from_mf",boss:"The Custodian",feedback:"That is the open-economy AD derivation from Mundell-Fleming."},
{id:9104,q:"Legendary tariff trap: a tariff is imposed in a small open economy. Which answer avoids the rookie mistake?",options:["The real exchange rate appreciates, offsetting the direct rise in NX demand, so the trade balance need not improve","NX rises permanently because imports are lower","Saving rises because tariffs create fiscal expansion","The world interest rate rises because the country is small"],a:0,tag:"trade_policy",type:"legendary_boss_trap",objective:"LO6.5",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"tariff_exchange_rate_offset",repairSkill:"tariff_exchange_rate_offset",boss:"The Custodian",feedback:"Trade barriers affect the exchange rate. The appreciation offsets the direct effect on NX."},
{id:9105,q:"Legendary policy ranking: in a small open economy with floating exchange rates, which tool is strongest for changing output in Mundell-Fleming?",options:["Monetary policy","Fiscal policy","Trade policy","Tariffs only"],a:0,tag:"floating_exchange_policy",type:"legendary_boss_policy",objective:"LO14.1",difficulty:"legendaryBoss",conceptCluster:"citadel_synthesis",primarySkill:"rank_policy_under_floating",repairSkill:"rank_policy_under_floating",boss:"The Custodian",feedback:"Under floating rates, monetary policy is powerful because exchange-rate depreciation reinforces the output effect."}
],
easy: [
{id:1,q:"Net exports equal...",options:["exports minus imports","imports minus exports","saving plus investment","government spending minus taxes"],a:0,tag:"trade_balance_net_exports",type:"definition",objective:"LO6.1",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"net_exports_definition",repairSkill:"net_exports_definition",feedback:"NX = X - M: exports minus imports."},
{id:2,q:"If exports are 500 and imports are 620, net exports are...",options:["-120","120","1120","500"],a:0,tag:"trade_balance_net_exports",type:"calculation",objective:"LO6.2",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"calculate_net_exports",repairSkill:"calculate_net_exports",feedback:"NX = 500 - 620 = -120."},
{id:3,q:"A trade surplus means...",options:["exports exceed imports","imports exceed exports","saving is less than investment","the currency is fixed"],a:0,tag:"trade_balance_net_exports",type:"definition",objective:"LO6.4",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"interpret_trade_surplus",repairSkill:"interpret_trade_surplus",feedback:"A trade surplus means X > M, so NX is positive."},
{id:4,q:"A trade deficit means...",options:["imports exceed exports","exports exceed imports","NX is positive","saving must exceed investment"],a:0,tag:"trade_balance_net_exports",type:"definition",objective:"LO6.4",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"interpret_trade_deficit",repairSkill:"interpret_trade_deficit",feedback:"A trade deficit means imports exceed exports, so NX is negative."},
{id:5,q:"The open-economy income identity is...",options:["Y = C + I + G + NX","Y = C + I + G","S = C + G + NX","NX = M - X"],a:0,tag:"accounting_identities",type:"definition",objective:"LO6.1",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"open_economy_identity",repairSkill:"open_economy_identity",feedback:"Open economies include net exports: Y = C + I + G + NX."},
{id:6,q:"If Y exceeds domestic spending C + I + G, the economy has...",options:["positive net exports","negative net exports","zero saving","no investment"],a:0,tag:"accounting_identities",type:"interpretation",objective:"LO6.1",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"domestic_spending_output_gap",repairSkill:"domestic_spending_output_gap",feedback:"If output exceeds domestic spending, the extra output is exported."},
{id:7,q:"In the identity S - I = NX, if saving rises and investment does not change, NX...",options:["rises","falls","must be zero","becomes unrelated to trade"],a:0,tag:"saving_investment_capital_flows",type:"interpretation",objective:"LO6.2",difficulty:"easy",conceptCluster:"identity_chain",primarySkill:"saving_shift_nx",repairSkill:"saving_shift_nx",feedback:"Higher saving raises S - I, so NX rises."},
{id:8,q:"In a small open economy, the domestic interest rate is tied to...",options:["the world interest rate","domestic monopoly price","the CPI only","government purchases only"],a:0,tag:"small_open_world_interest_rate",type:"definition",objective:"LO6.3",difficulty:"easy",conceptCluster:"small_open_model",primarySkill:"world_interest_rate",repairSkill:"world_interest_rate",feedback:"The small open economy takes the world interest rate as given."},
{id:9,q:"Perfect capital mobility means residents can...",options:["borrow and lend at the world interest rate","never invest abroad","set the exchange rate directly","avoid all trade deficits"],a:0,tag:"small_open_world_interest_rate",type:"definition",objective:"LO6.3",difficulty:"easy",conceptCluster:"small_open_model",primarySkill:"capital_mobility",repairSkill:"capital_mobility",feedback:"Perfect capital mobility lets funds move freely across borders at r*."},
{id:10,q:"A nominal exchange rate is...",options:["the relative price of two currencies","exports minus imports","the relative price of goods across countries","saving minus investment"],a:0,tag:"exchange_rate_adjustment",type:"definition",objective:"LO6.4",difficulty:"easy",conceptCluster:"exchange_rate_logic",primarySkill:"nominal_vs_real_exchange_rate",repairSkill:"nominal_vs_real_exchange_rate",feedback:"The nominal exchange rate is the price of one currency in terms of another."},
{id:11,q:"A real exchange rate is...",options:["the relative price of goods across countries","exports minus imports","government spending minus taxes","the reserve ratio"],a:0,tag:"real_exchange_rate",type:"definition",objective:"LO6.4",difficulty:"easy",conceptCluster:"exchange_rate_logic",primarySkill:"nominal_vs_real_exchange_rate",repairSkill:"nominal_vs_real_exchange_rate",feedback:"The real exchange rate compares goods prices across countries after currency conversion."},
{id:12,q:"When the domestic currency appreciates, domestic goods become...",options:["more expensive to foreigners","cheaper to foreigners","unrelated to trade","free in real terms"],a:0,tag:"exchange_rate_adjustment",type:"interpretation",objective:"LO6.4",difficulty:"easy",conceptCluster:"exchange_rate_logic",primarySkill:"appreciation_nx",repairSkill:"appreciation_nx",feedback:"Appreciation makes domestic goods relatively more expensive, lowering exports."},
{id:13,q:"When the domestic currency depreciates, net exports tend to...",options:["rise","fall","stay fixed by law","equal investment"],a:0,tag:"exchange_rate_adjustment",type:"interpretation",objective:"LO6.4",difficulty:"easy",conceptCluster:"exchange_rate_logic",primarySkill:"depreciation_nx",repairSkill:"depreciation_nx",feedback:"Depreciation makes domestic goods cheaper, raising exports and lowering imports."},
{id:14,q:"The Mundell-Fleming model extends IS-LM by adding...",options:["net exports and exchange rates","only monopoly power","only unemployment insurance","only the money multiplier"],a:0,tag:"mundell_fleming_model",type:"definition",objective:"LO14.1",difficulty:"easy",conceptCluster:"mf_chain",primarySkill:"mundell_fleming_assumptions",repairSkill:"mundell_fleming_assumptions",feedback:"Mundell-Fleming adds international trade finance and exchange rates to IS-LM."},
{id:15,q:"In Mundell-Fleming, IS* includes...",options:["Y = C(Y-T) + I(r*) + G + NX(e)","M/P = L(r,Y) only","S = I only","π = μ - gY only"],a:0,tag:"mundell_fleming_is_lm",type:"definition",objective:"LO14.1",difficulty:"easy",conceptCluster:"mf_chain",primarySkill:"is_star_exchange_rate",repairSkill:"is_star_exchange_rate",feedback:"IS* is the goods-market equation with NX depending on the exchange rate."},
{id:16,q:"A fixed exchange rate is maintained by...",options:["central bank buying and selling currency to defend the peg","letting the exchange rate move freely","banning all exports","setting NX equal to zero"],a:0,tag:"fixed_floating_exchange_regimes",type:"definition",objective:"LO14.3",difficulty:"easy",conceptCluster:"regime_chain",primarySkill:"fixed_exchange_definition",repairSkill:"fixed_exchange_definition",feedback:"A fixed regime requires intervention to keep the exchange rate at the target."},
{id:17,q:"A floating exchange rate is...",options:["allowed to move with market conditions","set permanently by law","always equal to one","unrelated to capital flows"],a:0,tag:"fixed_floating_exchange_regimes",type:"definition",objective:"LO14.3",difficulty:"easy",conceptCluster:"regime_chain",primarySkill:"floating_exchange_definition",repairSkill:"floating_exchange_definition",feedback:"A floating exchange rate adjusts to market forces and policy shocks."},
{id:18,q:"The impossible trinity says a nation cannot simultaneously have fixed exchange rates, free capital flows, and...",options:["independent monetary policy","fiscal policy","imports","exports"],a:0,tag:"impossible_trinity",type:"definition",objective:"LO14.3",difficulty:"easy",conceptCluster:"regime_chain",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",feedback:"The missing third corner is independent monetary policy."},
{id:19,q:"If the price level falls in Mundell-Fleming, real money balances...",options:["rise","fall","stay fixed","become NX"],a:0,tag:"mundell_fleming_ad",type:"interpretation",objective:"LO14.4",difficulty:"easy",conceptCluster:"ad_derivation",primarySkill:"real_balances_price_level",repairSkill:"real_balances_price_level",feedback:"With M fixed, a lower P raises M/P."},
{id:20,q:"The open-economy AD curve is derived by allowing...",options:["the price level to change in Mundell-Fleming","monopoly price to change","saving to equal zero","tariffs to become infinite"],a:0,tag:"mundell_fleming_ad",type:"definition",objective:"LO14.4",difficulty:"easy",conceptCluster:"ad_derivation",primarySkill:"derive_ad_from_mf",repairSkill:"derive_ad_from_mf",feedback:"The AD derivation comes from how changes in P shift real balances, exchange rates, NX, and Y."}
],
medium: [
{id:100,q:"Given S = 900 and I = 1050, what is the trade balance?",options:["NX = -150, trade deficit","NX = 150, trade surplus","NX = 1950, trade surplus","NX = 0, balanced trade"],a:0,tag:"saving_investment_capital_flows",type:"calculation",objective:"LO6.2",difficulty:"medium",conceptCluster:"identity_chain",primarySkill:"calculate_nx_from_s_i",repairSkill:"calculate_nx_from_s_i",feedback:"NX = S - I = 900 - 1050 = -150."},
{id:101,q:"Given Y = 1400, C = 800, I = 250, and G = 300, find NX.",options:["50","-50","350","550"],a:0,tag:"accounting_identities",type:"calculation",objective:"LO6.2",difficulty:"medium",conceptCluster:"identity_chain",primarySkill:"calculate_nx_from_y_c_i_g",repairSkill:"calculate_nx_from_y_c_i_g",feedback:"NX = 1400 - 800 - 250 - 300 = 50."},
{id:102,q:"A tax cut raises consumption while government spending is unchanged. In the small open economy model, what happens to national saving and NX?",options:["Saving falls and NX falls","Saving rises and NX rises","Saving falls and NX rises","Saving is unchanged and NX is unchanged"],a:0,tag:"fiscal_policy_open_economy",type:"multi-step",objective:"LO6.5",difficulty:"medium",conceptCluster:"policy_chain",primarySkill:"trace_domestic_fiscal_expansion",repairSkill:"trace_domestic_fiscal_expansion",feedback:"A tax cut raises consumption and lowers private saving, reducing S - I and NX."},
{id:103,q:"If government spending falls in a small open economy, all else equal, what happens to S - I and the trade balance?",options:["S - I rises and the trade balance moves toward surplus","S - I falls and the trade balance moves toward deficit","Investment rises because r* falls","NX is unaffected because trade policy did not change"],a:0,tag:"fiscal_policy_open_economy",type:"interpretation",objective:"LO6.5",difficulty:"medium",conceptCluster:"policy_chain",primarySkill:"trace_domestic_fiscal_contraction",repairSkill:"trace_domestic_fiscal_contraction",feedback:"Lower G raises public saving, increasing S - I and NX."},
{id:104,q:"A rise in the world interest rate affects a small open economy by...",options:["lowering domestic investment and raising NX","raising domestic investment and lowering NX","changing domestic saving automatically to zero","eliminating capital mobility"],a:0,tag:"foreign_fiscal_policy",type:"multi-step",objective:"LO6.5",difficulty:"medium",conceptCluster:"policy_chain",primarySkill:"foreign_fiscal_world_rate",repairSkill:"foreign_fiscal_world_rate",feedback:"Higher r* reduces investment; with saving fixed, S - I and NX rise."},
{id:105,q:"Investment demand rises because of a technology boom while saving stays fixed. What happens to net capital outflow?",options:["It falls","It rises","It must equal zero","It becomes exports only"],a:0,tag:"saving_investment_capital_flows",type:"interpretation",objective:"LO6.5",difficulty:"medium",conceptCluster:"small_open_model",primarySkill:"investment_shift_trade_balance",repairSkill:"investment_shift_trade_balance",feedback:"Higher investment lowers S - I, so net capital outflow falls."},
{id:106,q:"A real exchange rate appreciation causes...",options:["exports to fall and imports to rise","exports to rise and imports to fall","NX to rise by identity","investment to equal saving automatically"],a:0,tag:"exchange_rate_adjustment",type:"interpretation",objective:"LO6.4",difficulty:"medium",conceptCluster:"exchange_rate_logic",primarySkill:"appreciation_nx",repairSkill:"appreciation_nx",feedback:"Appreciation makes domestic goods expensive relative to foreign goods, reducing NX."},
{id:107,q:"Calculate ε if e = 1.5 foreign currency per dollar, P = 120, and P* = 100.",options:["1.8","0.8","1.25","2.5"],a:0,tag:"real_exchange_rate",type:"calculation",objective:"LO6.4",difficulty:"medium",conceptCluster:"exchange_rate_logic",primarySkill:"calculate_real_exchange_rate",repairSkill:"calculate_real_exchange_rate",feedback:"ε = eP/P* = 1.5(120)/100 = 1.8."},
{id:108,q:"If a country imposes an import quota, what does the open-economy model predict after exchange-rate adjustment?",options:["The real exchange rate appreciates, offsetting the direct NX effect","NX rises permanently by the quota amount","Saving falls automatically","The world interest rate rises"],a:0,tag:"trade_policy",type:"trap",objective:"LO6.5",difficulty:"medium",conceptCluster:"policy_chain",primarySkill:"tariff_exchange_rate_offset",repairSkill:"tariff_exchange_rate_offset",feedback:"Import restrictions raise demand for NX, but appreciation offsets the trade-balance effect."},
{id:109,q:"Capital flight from the domestic economy tends to...",options:["increase net capital outflow and depreciate the currency","decrease net capital outflow and appreciate the currency","make NX zero","lower exports because the currency appreciates"],a:0,tag:"capital_flight",type:"multi-step",objective:"LO6.5",difficulty:"medium",conceptCluster:"policy_chain",primarySkill:"capital_flight_exchange_rate",repairSkill:"capital_flight_exchange_rate",feedback:"Capital flight raises NCO and increases the supply of domestic currency in foreign exchange markets, causing depreciation."},
{id:110,q:"In Mundell-Fleming, if the exchange rate appreciates, the IS* curve is pressured because...",options:["NX falls and planned expenditure falls","NX rises and planned expenditure rises","money demand disappears","r* becomes endogenous"],a:0,tag:"mundell_fleming_is_lm",type:"interpretation",objective:"LO14.1",difficulty:"medium",conceptCluster:"mf_chain",primarySkill:"is_star_exchange_rate",repairSkill:"is_star_exchange_rate",feedback:"Appreciation lowers NX, which lowers planned expenditure and income."},
{id:111,q:"Under floating rates, expansionary fiscal policy is weak because...",options:["currency appreciation crowds out net exports","currency depreciation crowds out imports","LM* cannot shift","r* becomes zero"],a:0,tag:"floating_exchange_policy",type:"interpretation",objective:"LO14.1",difficulty:"medium",conceptCluster:"mf_chain",primarySkill:"floating_fiscal_policy",repairSkill:"floating_fiscal_policy",feedback:"Fiscal expansion attracts capital, appreciates the currency, and reduces NX."},
{id:112,q:"Under floating rates, expansionary monetary policy raises income because it...",options:["depreciates the currency and raises NX","appreciates the currency and lowers NX","forces fiscal policy to contract","fixes the exchange rate"],a:0,tag:"floating_exchange_policy",type:"interpretation",objective:"LO14.1",difficulty:"medium",conceptCluster:"mf_chain",primarySkill:"floating_monetary_policy",repairSkill:"floating_monetary_policy",feedback:"Monetary expansion depreciates the currency and increases net exports."},
{id:113,q:"Under fixed rates, why is monetary policy not independent?",options:["The central bank must adjust money supply to defend the peg","The government cannot tax","NX is permanently zero","Capital mobility is impossible"],a:0,tag:"fixed_exchange_policy",type:"interpretation",objective:"LO14.3",difficulty:"medium",conceptCluster:"regime_chain",primarySkill:"fixed_monetary_policy",repairSkill:"fixed_monetary_policy",feedback:"Defending the peg forces the central bank to buy or sell currency, changing the money supply as needed."},
{id:114,q:"Which policy mix is allowed by the impossible trinity?",options:["Floating exchange rate, free capital mobility, and independent monetary policy","Fixed exchange rate, free capital mobility, and independent monetary policy","Fixed exchange rate, no capital controls, and full monetary independence","All three corners at once"],a:0,tag:"impossible_trinity",type:"trap",objective:"LO14.3",difficulty:"medium",conceptCluster:"regime_chain",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",feedback:"Floating rates allow free capital mobility and monetary independence."},
{id:115,q:"In deriving AD from Mundell-Fleming, a lower price level causes...",options:["higher real money balances, lower exchange rate, higher NX, higher Y","lower real money balances, higher exchange rate, lower NX, lower Y","higher taxes and lower consumption","no change because prices are fixed"],a:0,tag:"mundell_fleming_ad",type:"multi-step",objective:"LO14.4",difficulty:"medium",conceptCluster:"ad_derivation",primarySkill:"derive_ad_from_mf",repairSkill:"derive_ad_from_mf",feedback:"A lower P raises M/P, shifts LM* right, depreciates the currency, raises NX, and raises Y."},
{id:116,q:"A fixed exchange rate may reduce exchange-rate uncertainty, but the cost is often...",options:["less monetary policy flexibility","no imports","no exports","higher perfect capital mobility by itself"],a:0,tag:"fixed_floating_exchange_regimes",type:"interpretation",objective:"LO14.3",difficulty:"medium",conceptCluster:"regime_chain",primarySkill:"compare_fixed_floating",repairSkill:"compare_fixed_floating",feedback:"Fixed exchange rates can stabilize currency values but constrain monetary policy."}
],
hard: [
{id:500,q:"A small open economy begins with S = I. Domestic government spending rises. Which full chain is most accurate?",options:["Public saving falls → S - I falls → NCO falls → real exchange rate appreciates → NX falls","Public saving rises → NCO rises → depreciation → NX rises","Investment falls because r* falls → NX rises","Trade policy changes directly raise NX forever"],a:0,tag:"fiscal_policy_open_economy",type:"multi-step",objective:"LO6.5",difficulty:"hard",conceptCluster:"policy_chain",primarySkill:"trace_domestic_fiscal_expansion",repairSkill:"trace_domestic_fiscal_expansion",feedback:"Expansionary fiscal policy reduces saving, lowers S - I, appreciates the real exchange rate, and lowers NX."},
{id:501,q:"A foreign fiscal expansion raises r*. In the domestic small open economy, which outcome is most likely?",options:["Investment falls, S - I rises, the currency depreciates, and NX rises","Investment rises, S - I falls, the currency appreciates, and NX falls","Saving falls because foreign G rises","NX cannot change unless tariffs change"],a:0,tag:"foreign_fiscal_policy",type:"multi-step",objective:"LO6.5",difficulty:"hard",conceptCluster:"policy_chain",primarySkill:"foreign_fiscal_world_rate",repairSkill:"foreign_fiscal_world_rate",feedback:"Higher r* reduces investment and raises S - I, increasing NCO and NX."},
{id:502,q:"Suppose policymakers want to reduce a trade deficit by imposing tariffs. What is the strongest model-based critique?",options:["The real exchange rate appreciates and offsets the direct reduction in imports","Tariffs lower saving and always worsen NX","Tariffs lower the world interest rate","Tariffs shift LM* right under every regime"],a:0,tag:"trade_policy",type:"trap",objective:"LO6.5",difficulty:"hard",conceptCluster:"policy_chain",primarySkill:"tariff_exchange_rate_offset",repairSkill:"tariff_exchange_rate_offset",feedback:"Tariffs can change trade composition but not necessarily the trade balance because exchange rates adjust."},
{id:503,q:"A country experiences capital flight. Which statement avoids the usual confusion?",options:["The currency depreciates, which tends to raise net exports, even though the event signals financial distress","The currency appreciates because everyone wants to leave","Net exports must fall because capital leaves","Capital flight has no exchange-rate effect"],a:0,tag:"capital_flight",type:"trap",objective:"LO6.5",difficulty:"hard",conceptCluster:"policy_chain",primarySkill:"capital_flight_exchange_rate",repairSkill:"capital_flight_exchange_rate",feedback:"Capital flight raises NCO and depreciates the currency, which can raise NX even while the broader event is harmful."},
{id:504,q:"A student says fiscal policy under floating exchange rates works just like in a closed economy. What correction is best?",options:["Capital inflows appreciate the currency, lowering NX and offsetting the fiscal expansion","Fiscal policy shifts LM* right through money supply","Floating rates block capital mobility","The world interest rate must rise permanently"],a:0,tag:"floating_exchange_policy",type:"trap",objective:"LO14.1",difficulty:"hard",conceptCluster:"mf_chain",primarySkill:"floating_fiscal_policy",repairSkill:"floating_fiscal_policy",feedback:"The open-economy exchange-rate channel weakens fiscal policy under floating rates."},
{id:505,q:"A central bank expands money under floating exchange rates. Which chain is complete?",options:["LM* right → exchange rate falls → NX rises → Y rises","IS* left → exchange rate rises → NX falls → Y falls","LM* left → exchange rate rises → NX rises → Y rises","IS* right → exchange rate fixed → no change in Y"],a:0,tag:"floating_exchange_policy",type:"multi-step",objective:"LO14.1",difficulty:"hard",conceptCluster:"mf_chain",primarySkill:"floating_monetary_policy",repairSkill:"floating_monetary_policy",feedback:"Expansionary monetary policy shifts LM* right, depreciates the currency, raises NX, and raises income."},
{id:506,q:"Under a fixed exchange rate, the central bank tries to cut interest rates below r*. What is likely?",options:["Capital outflow pressures depreciation, forcing intervention that reverses the monetary expansion","Capital inflow appreciates the currency and strengthens the expansion","NX rises permanently without intervention","The peg becomes easier to maintain automatically"],a:0,tag:"fixed_exchange_policy",type:"multi-step",objective:"LO14.3",difficulty:"hard",conceptCluster:"regime_chain",primarySkill:"fixed_monetary_policy",repairSkill:"fixed_monetary_policy",feedback:"The peg forces the bank to intervene, so independent monetary expansion is neutralized."},
{id:507,q:"A country chooses fixed exchange rates and free capital mobility. Which policy tool is sacrificed under the trilemma?",options:["Independent monetary policy","Fiscal policy","Trade policy","Government spending"],a:0,tag:"impossible_trinity",type:"interpretation",objective:"LO14.3",difficulty:"hard",conceptCluster:"regime_chain",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",feedback:"With fixed rates and free capital flows, monetary policy must serve the peg."},
{id:508,q:"A fall in P raises real money balances in Mundell-Fleming. Why does this help derive a downward-sloping AD curve?",options:["Higher M/P shifts LM* right, depreciates the currency, raises NX, and raises Y","Higher M/P shifts IS* left and lowers Y","Lower P reduces NX directly by making domestic goods expensive","Lower P raises r* and lowers investment"],a:0,tag:"mundell_fleming_ad",type:"multi-step",objective:"LO14.4",difficulty:"hard",conceptCluster:"ad_derivation",primarySkill:"open_economy_ad_slope",repairSkill:"open_economy_ad_slope",feedback:"Lower P leads to higher Y through real balances, exchange rates, and net exports."},
{id:509,q:"A memo says a fixed exchange rate gives stability and full domestic exchange power. What should be rejected?",options:["Full domestic exchange power, because maintaining the peg limits monetary independence","Stability, because fixed exchange rates never reduce currency volatility","The idea that pegs need intervention","The role of capital mobility"],a:0,tag:"fixed_floating_exchange_regimes",type:"trap",objective:"LO14.3",difficulty:"hard",conceptCluster:"regime_chain",primarySkill:"compare_fixed_floating",repairSkill:"compare_fixed_floating",feedback:"Fixed rates can provide exchange-rate stability, but they constrain monetary policy."},
{id:510,q:"An increase in money demand under floating rates shifts LM* left. What follows?",options:["The exchange rate appreciates, NX falls, and income falls","The exchange rate depreciates, NX rises, and income rises","Fiscal policy becomes impossible","The IS* curve shifts right automatically"],a:0,tag:"mundell_fleming_is_lm",type:"multi-step",objective:"LO14.1",difficulty:"hard",conceptCluster:"mf_chain",primarySkill:"lm_star_money_market",repairSkill:"lm_star_money_market",feedback:"Higher money demand tightens the money market, shifting LM* left and reducing income through appreciation and lower NX."},
{id:511,q:"A country lowers trade barriers under floating exchange rates. What does Mundell-Fleming predict about income after adjustment?",options:["The exchange rate depreciates enough to offset the initial fall in NX, leaving income unchanged","Income permanently falls because imports rise","Income permanently rises because exports rise","LM* shifts left because tariffs fell"],a:0,tag:"trade_policy",type:"multi-step",objective:"LO14.1",difficulty:"hard",conceptCluster:"mf_chain",primarySkill:"trade_policy_under_floating",repairSkill:"trade_policy_under_floating",feedback:"Trade policy shifts IS*, but exchange-rate adjustment offsets the income effect under floating rates."}

{id:9004,q:"Capital flight hits the Citadel. Which statement is careful enough to survive?",options:["Capital flight raises net capital outflow and depreciates the currency, which can raise NX while signaling financial stress.","Capital flight appreciates the currency because investors demand more domestic assets.","Capital flight lowers NX because exports must collapse.","Capital flight has no effect on the exchange rate."],a:0,tag:"capital_flight",type:"legendary_synthesis",objective:"LO6.5",difficulty:"legendary",conceptCluster:"policy_chain",primarySkill:"capital_flight_exchange_rate",repairSkill:"capital_flight_exchange_rate",feedback:"Capital flight raises NCO and depreciates the currency. The trade effect and the welfare story are not the same thing."},
{id:9005,q:"Under floating exchange rates, fiscal expansion is proposed to fight a recession. Which Custodian ruling is most accurate?",options:["Fiscal expansion appreciates the currency and lowers NX, so the output effect is offset.","Fiscal expansion depreciates the currency and strongly raises NX.","Fiscal expansion shifts LM* right because government spending is money supply.","Fiscal expansion is impossible when capital is mobile."],a:0,tag:"floating_exchange_policy",type:"legendary_synthesis",objective:"LO14.1",difficulty:"legendary",conceptCluster:"mf_chain",primarySkill:"floating_fiscal_policy",repairSkill:"floating_fiscal_policy",feedback:"Floating-rate fiscal policy is weakened by appreciation and falling net exports."},
{id:9006,q:"Under floating exchange rates, monetary expansion is proposed. Which memo should be approved?",options:["LM* shifts right, the currency depreciates, NX rises, and income rises.","IS* shifts right, the currency appreciates, NX falls, and income is unchanged.","The peg forces the central bank to reverse the policy.","Monetary expansion affects only prices and never output in Mundell-Fleming."],a:0,tag:"floating_exchange_policy",type:"legendary_synthesis",objective:"LO14.1",difficulty:"legendary",conceptCluster:"mf_chain",primarySkill:"floating_monetary_policy",repairSkill:"floating_monetary_policy",feedback:"Under floating rates, monetary policy is reinforced through depreciation and net exports."},
{id:9007,q:"A country pegs its currency and allows free capital mobility. A minister demands independent monetary expansion. Which trilemma response is correct?",options:["The country cannot keep all three; defending the peg sacrifices monetary independence.","The country can keep all three if NX is positive.","The country can keep all three if it raises tariffs.","The trilemma applies only if the economy is closed."],a:0,tag:"impossible_trinity",type:"legendary_policy",objective:"LO14.3",difficulty:"legendary",conceptCluster:"regime_chain",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",feedback:"Fixed exchange rate + free capital mobility means monetary policy serves the peg."},
{id:9008,q:"The price level falls in the Mundell-Fleming model. Which AD derivation is correct?",options:["M/P rises → LM* shifts right → exchange rate depreciates → NX rises → Y rises.","M/P falls → LM* shifts left → exchange rate appreciates → NX falls → Y falls.","IS* shifts left because lower prices reduce exports.","The world interest rate rises and investment falls."],a:0,tag:"mundell_fleming_ad",type:"legendary_synthesis",objective:"LO14.4",difficulty:"legendary",conceptCluster:"ad_derivation",primarySkill:"derive_ad_from_mf",repairSkill:"derive_ad_from_mf",feedback:"That is the clean open-economy AD chain."},
{id:9009,q:"The Custodian asks why the IS* curve slopes downward in exchange-rate/output space. Which answer survives?",options:["A lower exchange rate raises NX, increasing planned expenditure and income.","A lower exchange rate lowers NX, reducing income.","A higher exchange rate shifts LM* right.","The exchange rate has no place in IS*."],a:0,tag:"mundell_fleming_is_lm",type:"legendary_definition",objective:"LO14.1",difficulty:"legendary",conceptCluster:"mf_chain",primarySkill:"is_star_exchange_rate",repairSkill:"is_star_exchange_rate",feedback:"Lower exchange rates boost NX, so income rises along IS*."},
{id:9010,q:"A student says fixed exchange rates are always better because they reduce uncertainty. Which correction is strongest?",options:["Fixed rates may reduce currency uncertainty, but they restrict monetary policy and can face speculative pressure.","Fixed rates remove all recessions.","Fixed rates make capital mobility irrelevant.","Fixed rates guarantee trade surpluses."],a:0,tag:"fixed_floating_exchange_regimes",type:"legendary_policy",objective:"LO14.3",difficulty:"legendary",conceptCluster:"regime_chain",primarySkill:"compare_fixed_floating",repairSkill:"compare_fixed_floating",feedback:"Fixed regimes have benefits, but they come with policy constraints and defense risks."},
{id:9011,q:"Under floating rates, an import quota initially raises NX demand. What happens in Mundell-Fleming after the exchange rate adjusts?",options:["The exchange rate appreciates and income returns to its original level.","The exchange rate depreciates and income rises permanently.","LM* shifts right because imports are lower.","The world interest rate rises because of the quota."],a:0,tag:"trade_policy",type:"legendary_synthesis",objective:"LO14.1",difficulty:"legendary",conceptCluster:"mf_chain",primarySkill:"trade_policy_under_floating",repairSkill:"trade_policy_under_floating",feedback:"Trade policy under floating rates is offset through exchange-rate movement."},
{id:9012,q:"The Custodian reviews this policy package: fixed exchange rate, independent monetary policy, and no capital controls. What is the verdict?",options:["Impossible trinity violation","Strongest possible exchange package","Only possible under floating rates","A trade-balance identity"],a:0,tag:"impossible_trinity",type:"legendary_trap",objective:"LO14.3",difficulty:"legendary",conceptCluster:"regime_chain",primarySkill:"impossible_trinity",repairSkill:"impossible_trinity",feedback:"That package tries to take all three corners. The trilemma says no."},
{id:9013,q:"A country with floating rates faces a fall in money demand because banking access improves. What does the model predict?",options:["LM* shifts right, the currency depreciates, NX rises, and income rises.","LM* shifts left, the currency appreciates, and income falls.","IS* shifts left because money demand is exports.","The fixed peg forces reversal."],a:0,tag:"mundell_fleming_is_lm",type:"legendary_synthesis",objective:"LO14.1",difficulty:"legendary",conceptCluster:"mf_chain",primarySkill:"lm_star_money_market",repairSkill:"lm_star_money_market",feedback:"Lower money demand works like an increase in real balances: LM* shifts right and income rises."},

function shuffleOptions(question){
    let q = {
        id: question.id,
        q: question.q,
        options: [...question.options],
        a: question.a,
        feedback: question.feedback,
        hint: question.hint,
        tag: question.tag,
        type: question.type,
        objective: question.objective,
        image: question.image,
        difficulty: question.difficulty,
        conceptCluster: question.conceptCluster,
        primarySkill: question.primarySkill,
        secondarySkills: question.secondarySkills ? [...question.secondarySkills] : [],
        repairSkill: question.repairSkill,
        commonError: question.commonError
    };

    let correct = q.options[q.a];

    for(let i = q.options.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    q.a = q.options.indexOf(correct);
    return q;
}

// QUESTION SELECTION ENGINE — DO NOT MODIFY
// =============================================
// Handles:
// - non-repetition
// - difficulty filtering
// - type balancing
//
// Breaking this = repeated questions or bad difficulty scaling
     
function randomQuestion(poolName) {
    let pool = questionBanks[poolName];

    // Safety check in case poolName is invalid
    if (!pool) return null;
    
    let used = [
        ...usedQuestions.easy,
        ...usedQuestions.medium,
        ...usedQuestions.hard,
        ...usedQuestions.easyBoss,
        ...usedQuestions.mediumBoss,
        ...usedQuestions.finalBoss,
        ...usedQuestions.legendaryBoss,
    ];

    let available = pool.filter(q => !used.includes(q.id));

    if (available.length === 0) {
        usedQuestions[poolName] = [];
        available = pool;
    }

    // Avoid three identical question types in a row
    let filtered = available;

    if (lastTypes.length >= 2) {
        let last1 = lastTypes[lastTypes.length - 1];
        let last2 = lastTypes[lastTypes.length - 2];

        if (last1 === last2) {
            filtered = available.filter(q => q.type !== last1);
            if (filtered.length === 0) filtered = available;
        }
    }

    let question = filtered[Math.floor(Math.random() * filtered.length)];

    usedQuestions[poolName].push(question.id);

    // Track types
    lastTypes.push(question.type);
    if (lastTypes.length > 3) {
        lastTypes.shift();
    }

    return question;
}

// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:
// - no immediate repeats
// - full coverage before reuse
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding new generators (calculationGenerators)
// - modifying pool content
//
// DO NOT MODIFY:

// - predictable patterns
//
// This ensures randomness WITHOUT repetition.
// =============================================     

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Bag system for calculation generators
// Ensures all generators are used before repeating
let calcBag = [];

// Pulls one calculation generator from the bag
// Refills bag when empty (reshuffled)
function pickCalcGenerator(){
    if(calcBag.length === 0){
        calcBag = shuffle([...calculationGenerators]);
    }
    return calcBag.pop();
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    if(rapidGuessHistory.length < RAPID_GUESS_CONFIG.minAttempts){
        return {
            triggered: false,
            avgTime: responseTime,
            accuracy: isCorrect ? 1 : 0
        };
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);

    const avgTime = recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length;
    const accuracy = recent.reduce((sum, item) => sum + item.correct, 0) / recent.length;

    return {
        triggered: avgTime < RAPID_GUESS_CONFIG.avgTimeMs && accuracy < RAPID_GUESS_CONFIG.maxAccuracy,
        avgTime,
        accuracy
    };
}

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|ARCHIVE42)
// - hashing logic
// - return format ("ARCH-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "ARCHIVE42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|LEDGER55`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "LDGR-" + Math.abs(hash).toString(36).toUpperCase();
}

// =============================================
// ARRAY SHUFFLE UTILITY — SAFE TO USE, DO NOT MODIFY
// =============================================
// Fisher-Yates shuffle algorithm.
//
// Used to randomize:
// - question order
// - calculation generators
// - any randomized sequences
//
// DO NOT MODIFY unless you understand:
// - uniform randomness
// - bias in random selection
//
// Breaking this = predictable patterns in questions
// =============================================     
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
}     

// =============================================
// HIGH SCORE TRACKING — OPTIONAL FEATURE
// =============================================
// Stores top completion times in browser (localStorage)
//
// - Saves name, time, and date
// - Sorts fastest → slowest
// - Keeps top 5 results only
//
// SAFE TO EDIT:
// - number of scores kept (slice)
// - displayed fields (name/date)
//
// WARNING:
// Clearing browser data will erase scores.
// =============================================
function updateHighScores(newTimeMs) {
    let scores = JSON.parse(localStorage.getItem("gauntletHighScores")) || [];
    scores.push({ name: username, time: newTimeMs, date: new Date().toLocaleDateString() });
    
    // Sort by time (lowest/fastest first) and keep top 5
    scores.sort((a, b) => a.time - b.time);
    scores = scores.slice(0, 5);
    
    localStorage.setItem("gauntletHighScores", JSON.stringify(scores));
    return scores;
}

// =============================================
// TIME FORMATTER — SAFE UTILITY
// =============================================
// Converts milliseconds → readable format (Xm Ys)
//
// Used for:
// - victory screen
// - performance tracking
//
// Safe to modify format if desired.
// =============================================     
function formatTime(ms) {
    let mins = Math.floor(ms / 60000);
    let secs = Math.floor((ms / 1000) % 60);
    return `${mins}m ${secs}s`;
}

    const accuracy = Math.round((correctAnswers / totalAttempts) * 100);

        Time: ${timeString}
        Accuracy: ${accuracy}%
        Best Streak: ${maxStreak}
        Total Questions: ${totalAttempts}
        Code: ${code}
        Verified by The Exchange Citadel`;

    navigator.clipboard.writeText(shareText).then(() => {
        const btn = document.getElementById("shareBtn");
        const originalText = btn.innerText;
        const originalColor = btn.style.background;

        btn.innerText = "✅ Copied!";
        btn.style.background = "#059669";

        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = originalColor;
        }, 2000);
    });
}
